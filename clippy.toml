# Security invariants from security.md, enforced by `cargo clippy -D warnings`.
# Exceptions, each allowed at its call site with a reason: the admin TUI's
# host backend (platform-host SystemRunner) and its root helper
# (openvibes-admin helper), which run fixed commands, never a shell
# (admin TUI spec §4).
disallowed-types = [
    { path = "std::process::Command", reason = "security.md 2.3: no shells or external processes" },
]
disallowed-methods = [
    { path = "ureq::tls::TlsConfigBuilder::disable_verification", reason = "security.md 3.1: certificate validation is mandatory" },
    { path = "rustls::ConfigBuilder::dangerous", reason = "security.md 3.1: certificate validation is mandatory" },
    { path = "rustls::ClientConfig::dangerous", reason = "security.md 3.1: certificate validation is mandatory" },
    { path = "sysinfo::Process::kill", reason = "security.md 2.2/2.3: read-only; spawns taskkill.exe on Windows" },
    { path = "sysinfo::Process::kill_with", reason = "security.md 2.2/2.3: read-only; spawns taskkill.exe on Windows" },
    { path = "sysinfo::Process::kill_and_wait", reason = "security.md 2.2/2.3: read-only; spawns taskkill.exe on Windows" },
    { path = "sysinfo::Process::kill_with_and_wait", reason = "security.md 2.2/2.3: read-only; spawns taskkill.exe on Windows" },
]
