[workspace]
resolver = "3"
members = ["crates/openvibes-ingest", "crates/platform-config", "crates/platform-store", "crates/openvibes-admin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
openvibes-core = { git = "https://github.com/openvibes-project/openvibes-agent.git", rev = "e73e188ad0c8c4a5b75f21e494934177f0362a23" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
deadpool-postgres = "0.14.2"
clap = { version = "4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
