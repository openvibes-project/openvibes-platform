[workspace]
resolver = "3"
members = ["crates/openvibes-ingest", "crates/platform-agent-server", "crates/openvibes-distribution", "crates/openvibes-vulns", "crates/platform-config", "crates/platform-store", "crates/openvibes-admin", "crates/platform-pki", "scripts/load"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
openvibes-core = { git = "https://github.com/openvibes-project/openvibes-agent.git", rev = "e1005ff7bba5b4d616a000d8996931c5b4b55293" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
deadpool-postgres = { version = "0.14.2", features = ["rt_tokio_1"] }
clap = { version = "4.6.7", features = ["derive"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = { version = "0.18", features = ["verify"] }
time = "0.3"
ring = "0.17"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service", "server-graceful"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
openvibes-transport = { git = "https://github.com/openvibes-project/openvibes-agent.git", rev = "e1005ff7bba5b4d616a000d8996931c5b4b55293" }
openvibes-rules = { git = "https://github.com/openvibes-project/openvibes-agent.git", rev = "e1005ff7bba5b4d616a000d8996931c5b4b55293" }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
sha2 = { version = "0.11", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
