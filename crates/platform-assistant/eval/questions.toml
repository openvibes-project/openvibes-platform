[[cases]]
id = "findings-not-resolved"
question = "Is the firewall problem on db-02 resolved?"
lookups = ["finding_endpoints", "search_findings", "agent_summary"]
facts = ["not|cannot|can't|unknown|no "]
forbid = ["yes, it is resolved", "yes, it has been resolved"]

