# Published rules (rule set "baseline").
[[rules]]
rule = "ssh.exposed"
title = "SSH exposed on a non-loopback address"
severity = "high"
message = "SSH listens on a non-loopback address"
expression = "'22' in facts['port.tcp.exposed']"

[[rules]]
rule = "telnet.enabled"
title = "Telnet server running"
severity = "critical"
message = "A telnet server is listening"
expression = "'23' in facts['port.tcp.exposed']"

[[rules]]
rule = "firewall.off"
title = "Host firewall not running"
severity = "medium"
message = "The host firewall is not running"
expression = "!('firewalld' in facts['process.names'])"

[[rules]]
rule = "root.login.allowed"
title = "SSH root login allowed"
severity = "high"
message = "SSH permits root login"
expression = "facts['sshd.permit_root_login'] == 'yes'"

[[rules]]
rule = "auditd.missing"
title = "Audit daemon not running"
severity = "low"
message = "The audit daemon is not running"
expression = "!('auditd' in facts['process.names'])"
