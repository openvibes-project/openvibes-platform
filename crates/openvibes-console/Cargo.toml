[package]
name = "openvibes-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
embedded-ui = ["dep:include_dir"]
dev-seed = []

[dependencies]
argon2 = { version = "=0.6.0", features = ["zeroize"] }
axum = { workspace = true, features = ["query"] }
base64.workspace = true
include_dir = { workspace = true, optional = true }
platform-config = { path = "../platform-config" }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-normalization = "=0.1.25"
utoipa = { version = "=5.5.0", default-features = false, features = ["macros"] }
zeroize = "=1.9.0"

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tower.workspace = true

[lints]
workspace = true

[[example]]
name = "seeded_server"
required-features = ["dev-seed"]
