[package]
name = "openvibes-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
embedded-ui = ["dep:include_dir"]
dev-seed = []

[dependencies]
platform-password.workspace = true
argon2 = { version = "=0.6.0", features = ["zeroize"] }
axum = { workspace = true, features = ["matched-path", "query"] }
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
openvibes-core.workspace = true
openvibes-rules.workspace = true
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
include_dir = { workspace = true, optional = true }
platform-config = { path = "../platform-config" }
platform-pki = { path = "../platform-pki" }
platform-assistant = { path = "../platform-assistant" }
platform-store = { path = "../platform-store" }
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "=2.6.1"
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
tracing-subscriber.workspace = true
x509-parser.workspace = true
utoipa = { version = "=5.5.0", default-features = false, features = ["macros"] }
zeroize = "=1.9.0"

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
openvibes-signer = { path = "../openvibes-signer" }
rcgen.workspace = true
tower.workspace = true

[lints]
workspace = true

[[example]]
name = "seeded_server"
required-features = ["dev-seed"]
