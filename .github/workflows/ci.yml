# Every action is pinned to a full commit SHA with its version in a comment.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  OPENVIBES_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres

jobs:
  test:
    name: Lint, audit, and tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: crates/openvibes-console/web/package-lock.json

      # The agent (openvibes-core) and protocol (fixtures) repositories are
      # private. Each has its own fine-grained, read-only token, used only
      # for that repository's URL and verbatim, so GitHub's log masking holds.
      # The tokens live in a temporary git config for this step alone: every
      # fetch that needs them happens here, and later steps (whose build
      # scripts and tests run third-party code) build offline without them.
      - name: Fetch private dependencies
        shell: bash
        env:
          AGENT_TOKEN: ${{ secrets.OPENVIBESAGENT }}
          PROTOCOL_TOKEN: ${{ secrets.OPENVIBEPROTOCOL }}
        run: |
          if [ -z "$AGENT_TOKEN" ] || [ -z "$PROTOCOL_TOKEN" ]; then
            echo "::error::secrets OPENVIBESAGENT and OPENVIBEPROTOCOL must both be set"
            exit 1
          fi
          GIT_CONFIG_GLOBAL="$(mktemp)"
          export GIT_CONFIG_GLOBAL
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          git config --global url."https://x-access-token:${AGENT_TOKEN}@github.com/openvibes-project/openvibes-agent".insteadOf "https://github.com/openvibes-project/openvibes-agent"
          git config --global url."https://x-access-token:${PROTOCOL_TOKEN}@github.com/openvibes-project/openvibes-protocol".insteadOf "https://github.com/openvibes-project/openvibes-protocol"
          git submodule update --init
          cargo fetch --locked

      - name: Install console brand renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends imagemagick librsvg2-bin

      - name: Build and validate console frontend
        run: bash scripts/build-console.sh

      # Separate from the build so a new advisory fails CI loudly without
      # making the build itself depend on the day it runs.
      - name: Audit console npm dependencies
        run: npm --prefix crates/openvibes-console/web audit --audit-level=low

      - name: Prove console npm dependencies install offline
        run: |
          archive=$(bash scripts/build-console-npm-cache.sh target/console-npm-cache)
          bash scripts/check-console-npm-cache.sh "$archive"

      - name: Install pinned console browsers
        run: >-
          npm --prefix crates/openvibes-console/web exec --
          playwright install --with-deps chromium firefox webkit

      - name: Test console in real browsers
        run: bash scripts/test-console-e2e.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -F unsafe-code

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
          CARGO_NET_OFFLINE: "true"
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked --workspace --all-features

      # The Nagle stall (TCP_NODELAY missing) only shows when the server is
      # fast enough, i.e. in a release build; debug runs pass either way.
      - name: Release-mode latency test
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --release --locked -p openvibes-ingest --test delivery requests_are_not_delayed_by_nagle

      - name: Install cargo-audit
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-audit@0.22.2

      - name: Audit dependencies (RustSec)
        run: cargo audit --deny warnings

  fedora:
    name: RPMs and agent integration (fedora:44)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: registry.fedoraproject.org/fedora:44
    steps:
      # git first, so checkout makes a real repository (submodules need it).
      - name: Install build and test packages
        run: >-
          dnf -q -y install git gcc cargo rust rpm-build systemd-rpm-macros systemd
          postgresql-server sqlite jq curl procps-ng util-linux

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node.js for console RPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      # As in the ubuntu job: the tokens exist only in this step's temporary
      # git config; the pinned agent (a private git dependency) is built
      # here too, and later steps build offline.
      - name: Fetch private dependencies and build the pinned agent
        shell: bash
        env:
          AGENT_TOKEN: ${{ secrets.OPENVIBESAGENT }}
          PROTOCOL_TOKEN: ${{ secrets.OPENVIBEPROTOCOL }}
        run: |
          if [ -z "$AGENT_TOKEN" ] || [ -z "$PROTOCOL_TOKEN" ]; then
            echo "::error::secrets OPENVIBESAGENT and OPENVIBEPROTOCOL must both be set"
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          GIT_CONFIG_GLOBAL="$(mktemp)"
          export GIT_CONFIG_GLOBAL
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${AGENT_TOKEN}@github.com/openvibes-project/openvibes-agent".insteadOf "https://github.com/openvibes-project/openvibes-agent"
          git config --global url."https://x-access-token:${PROTOCOL_TOKEN}@github.com/openvibes-project/openvibes-protocol".insteadOf "https://github.com/openvibes-project/openvibes-protocol"
          git submodule update --init
          cargo fetch --locked
          ROOT=$PWD; source scripts/integration-lib.sh
          build_agent "$PWD/target/integration/agent" > agent-path
          # The agent's own RPM, from the same pinned revision (built offline
          # in a later step).
          git clone -q https://github.com/openvibes-project/openvibes-agent /opt/agent-src
          git -C /opt/agent-src checkout -q "$(agent_rev)"
          cargo fetch --locked --manifest-path /opt/agent-src/Cargo.toml

      - name: Build RPMs
        env:
          CARGO_NET_OFFLINE: "true"
        run: bash scripts/build-rpm.sh

      - name: Build offline console RPM
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          archive=$(bash scripts/build-console-npm-cache.sh target/console-npm-cache)
          digest=$(sha256sum "$archive" | cut -d ' ' -f1)
          bash scripts/build-console-rpm.sh "$archive" "$digest"

      - name: Build the agent RPM and signing tool (pinned revision)
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          bash /opt/agent-src/scripts/build-rpm.sh
          cargo build --release --locked --manifest-path /opt/agent-src/Cargo.toml \
            -p openvibes-rules --example sign_bundle
          mkdir -p dist
          cp target/rpm/RPMS/x86_64/*.rpm /opt/agent-src/target/rpm/RPMS/x86_64/openvibes-agent-*.rpm \
            /opt/agent-src/target/release/examples/sign_bundle dist/
          cp target/rpm-console/RPMS/x86_64/openvibes-console-*.rpm dist/

      - name: Upload RPMs for the systemd end to end
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms
          path: dist/
          if-no-files-found: error

      - name: Install and check RPMs
        run: |
          dnf -q -y install target/rpm/RPMS/x86_64/openvibes-*.rpm
          bash scripts/check-rpm.sh

      # initdb refuses root: build the test tools as root, then run the
      # integration as a plain user against the installed binaries.
      - name: Build the bundle tool and the load generator
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo build --release --locked -p openvibes-ingest --example integration_bundle
          cargo build --release --locked -p openvibes-load

      - name: Integration against the installed binaries
        shell: bash
        run: |
          useradd -m ci
          chown -R ci "$GITHUB_WORKSPACE"
          runuser -u ci -- env OPENVIBES_BIN_DIR=/usr/bin \
            AGENT_BIN="$(cat agent-path)" \
            BUNDLE_BIN="$PWD/target/release/examples/integration_bundle" \
            INTEGRATION_DIR=/home/ci/run \
            bash scripts/integration-agent.sh

      # A shared runner is too small and noisy for the full target run; this
      # keeps the generator working. Results live in docs/components/load.md.
      - name: Load smoke test against the installed binaries
        shell: bash
        run: |
          runuser -u ci -- env OPENVIBES_BIN_DIR=/usr/bin LOAD_DIR=/home/ci/load \
            LOAD_BIN="$PWD/target/release/openvibes-load" LOAD_ARGS="--findings-every 5" \
            bash scripts/load/run.sh 50 1000 10

      - name: Distribution load smoke against the installed binaries
        shell: bash
        run: |
          runuser -u ci -- env OPENVIBES_BIN_DIR=/usr/bin LOAD_DIR=/home/ci/load-dist MODE=distribution \
            LOAD_BIN="$PWD/target/release/openvibes-load" \
            BUNDLE_BIN="$PWD/target/release/examples/integration_bundle" \
            bash scripts/load/run.sh 50 1000 10

  # The documented install, scripted, under a real systemd (podman fedora:44,
  # systemd as PID 1): PostgreSQL and the platform/agent/console RPMs; the
  # agent enrolls, fetches rules, delivers findings, and the console serves TLS.
  systemd-e2e:
    name: End to end under systemd (platform, agent, and console RPMs)
    needs: fedora
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpms
          path: dist

      - name: End to end
        run: |
          chmod +x dist/sign_bundle
          bash scripts/systemd-e2e.sh dist dist/sign_bundle dist/openvibes-console-*.rpm
