# Every action is pinned to a full commit SHA with its version in a comment.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Nightly: the full tier (every browser, RPMs, end to end jobs) on main.
    - cron: "17 3 * * *"
  pull_request:
    branches: [main]
    # "labeled" lets the full-ci label start a run that has the heavy tier.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# Only pull requests cancel superseded runs; a run on main always finishes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  OPENVIBES_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres

jobs:
  # Decides which tiers run. Fast tier (rust, console): every run. Heavy tier
  # (RPMs and the end to end jobs, Firefox/WebKit, release latency test): runs
  # on main, nightly, on manual runs, with the full-ci label, and on pull
  # requests that change anything outside the web frontend and the docs.
  # Skipped jobs count as passing for required checks.
  changes:
    name: Choose test tiers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.pick.outputs.heavy }}
      kit: ${{ steps.pick.outputs.kit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pick tiers
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        run: |
          heavy=true
          # The offline kit test: always off pull requests; on them only when
          # the kit, its scripts or the spec changed (or with full-ci).
          kit=true
          if [ "$EVENT" = pull_request ]; then
            case ",$LABELS," in
              *,full-ci,*) ;;
              *)
                # Heavy unless every changed file is frontend source or docs.
                changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
                grep -qE '^(packaging/offline/|scripts/[^/]*offline[^/]*$|packaging/rpm/openvibes-platform\.spec$)' <<<"$changed" || kit=false
                if ! grep -qvE '^(crates/openvibes-console/web/(src|tests|e2e|public)/|docs/|[^/]+\.md$)' <<<"$changed"; then
                  heavy=false
                fi
                ;;
            esac
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "kit=$kit" >> "$GITHUB_OUTPUT"
          echo "heavy tier: $heavy"

  rust:
    name: Rust lint and tests
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: crates/openvibes-console/web/package-lock.json

      # Every fetch happens here; later steps (whose build scripts and tests
      # run third-party code) build offline.
      - name: Fetch dependencies
        shell: bash
        run: |
          git submodule update --init
          cargo fetch --locked

      - name: Install console brand renderer
        # A stalled Ubuntu mirror once held this step until the job's 30
        # minutes ran out (#105, #106): fail fast and retry instead.
        timeout-minutes: 5
        run: |
          apt=(sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          "${apt[@]}" update
          "${apt[@]}" install --no-install-recommends imagemagick librsvg2-bin

      # --all-features embeds the frontend, so clippy, docs and tests need it.
      - name: Build and validate console frontend
        run: bash scripts/build-console.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Account rename script
        run: bash scripts/test-rename-account.sh

      - name: No old account names
        run: bash scripts/check-names.sh

      - name: Clippy
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -F unsafe-code

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
          CARGO_NET_OFFLINE: "true"
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked --workspace --all-features

      # The Nagle stall (TCP_NODELAY missing) only shows when the server is
      # fast enough, i.e. in a release build; debug runs pass either way.
      # Heavy tier only: it needs a separate release build.
      - name: Release-mode latency test
        if: needs.changes.outputs.heavy == 'true'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --release --locked -p openvibes-ingest --test delivery requests_are_not_delayed_by_nagle

      - name: Install cargo-audit
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-audit@0.22.2

      - name: Audit dependencies (RustSec)
        run: cargo audit --deny warnings

  console:
    name: Console frontend and browsers
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: crates/openvibes-console/web/package-lock.json

      - name: Fetch dependencies
        shell: bash
        run: |
          git submodule update --init
          cargo fetch --locked

      - name: Install console brand renderer
        timeout-minutes: 5
        run: |
          apt=(sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          "${apt[@]}" update
          "${apt[@]}" install --no-install-recommends imagemagick librsvg2-bin

      - name: Build and validate console frontend
        run: bash scripts/build-console.sh

      # Separate from the build so a new advisory fails CI loudly without
      # making the build itself depend on the day it runs.
      - name: Audit console npm dependencies
        run: npm --prefix crates/openvibes-console/web audit --audit-level=low

      - name: Prove console npm dependencies install offline
        run: |
          archive=$(bash scripts/build-console-npm-cache.sh target/console-npm-cache)
          bash scripts/check-console-npm-cache.sh "$archive"

      # Pull requests without the heavy tier test in Chromium only; main,
      # nightly, manual runs and heavy PRs also run Firefox and WebKit.
      - name: Install pinned console browsers
        env:
          BROWSERS: ${{ needs.changes.outputs.heavy == 'true' && 'chromium firefox webkit' || 'chromium' }}
        run: >-
          crates/openvibes-console/web/node_modules/.bin/playwright
          install --with-deps $BROWSERS

      - name: Test console in real browsers
        env:
          PROJECTS: ${{ needs.changes.outputs.heavy == 'true' && '' || '--project=chromium' }}
        run: bash scripts/test-console-e2e.sh $PROJECTS

  # The required check name; it keeps saying ubuntu-latest until an admin
  # renames the check (board #29). It passes when both fast jobs pass.
  test:
    name: Lint, audit, and tests (ubuntu-latest)
    needs: [rust, console]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the fast tier
        env:
          RESULTS: ${{ needs.rust.result }} ${{ needs.console.result }}
        run: |
          echo "rust and console: $RESULTS"
          [ "$RESULTS" = "success success" ]

  fedora:
    name: RPMs (fedora:44)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: registry.fedoraproject.org/fedora:44
    steps:
      # git first, so checkout makes a real repository (submodules need it).
      - name: Install build packages
        run: dnf -q -y install git gcc gcc-c++ cmake cargo rust rpm-build systemd-rpm-macros ImageMagick rpm-sign gnupg2 cpio

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node.js for console RPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      # As in the ubuntu job, every fetch happens here and later steps build
      # offline. The agent RPM comes from the pinned revision; its binary is
      # also the one the integration job runs.
      - name: Fetch dependencies
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init
          cargo fetch --locked
          ROOT=$PWD; source scripts/integration-lib.sh
          git clone -q https://github.com/openvibes-project/openvibes-agent /opt/agent-src
          git -C /opt/agent-src checkout -q "$(agent_rev)"
          cargo fetch --locked --manifest-path /opt/agent-src/Cargo.toml
          # The agent embeds an eBPF program (agent #56), built with its pinned
          # nightly and bpf-linker: install both, then fetch the eBPF crate's
          # dependencies (every target: its build scripts and macros run on
          # the host) and the nightly's standard library workspace (-Z
          # build-std resolves it whole), so the agent RPM still builds offline.
          BIN=/usr/local/bin bash /opt/agent-src/scripts/ebpf-tools.sh
          ebpf=/opt/agent-src/ebpf/openvibes-agent-ebpf
          nightly=$(sed -n 's/^channel = "\(.*\)"$/\1/p' "$ebpf/rust-toolchain.toml")
          (cd "$ebpf" && rustup run "$nightly" cargo fetch --locked)
          lib=$(rustup run "$nightly" rustc --print sysroot)/lib/rustlib/src/rust/library
          rustup run "$nightly" cargo fetch --locked --manifest-path "$lib/Cargo.toml"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            /opt/agent-src -> target

      - name: Cache llama.cpp build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/llama
          key: llama-${{ hashFiles('packaging/llm/llama-cpp.pin', 'scripts/build-llama-server.sh') }}

      - name: Package signing script
        run: bash scripts/test-sign-rpms.sh

      - name: Build lower-version RPMs for the update test
        env:
          OV_RELEASE: 1.1.ci${{ github.run_number }}
          CARGO_NET_OFFLINE: "true"
          OV_LLM: "0"
          OV_VERSION: "0.0.9"
          OV_RPM_TOPDIR: ${{ github.workspace }}/target/rpm-old
        run: |
          bash scripts/build-rpm.sh
          mkdir -p dist/old
          cp target/rpm-old/RPMS/x86_64/openvibes-*.rpm dist/old/

      - name: Build RPMs
        env:
          OV_RELEASE: 1.1.ci${{ github.run_number }}
          CARGO_NET_OFFLINE: "true"
        run: bash scripts/build-rpm.sh

      - name: Check the built packages carry no model
        run: OV_CHECK_BUILT=1 bash scripts/check-rpm.sh

      - name: Build offline console RPM
        env:
          OV_RELEASE: 1.1.ci${{ github.run_number }}
          CARGO_NET_OFFLINE: "true"
        run: |
          archive=$(bash scripts/build-console-npm-cache.sh target/console-npm-cache)
          digest=$(sha256sum "$archive" | cut -d ' ' -f1)
          # The lower-version package exercises a genuine RPM upgrade in the
          # systemd job; it uses the same binary and schemas because the
          # console package itself owns neither database migrations nor data.
          bash scripts/build-console-rpm.sh "$archive" "$digest" 0.0.9 \
            "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"

      - name: Build the agent RPM and the test tools
        env:
          OV_RELEASE: 1.1.ci${{ github.run_number }}
          CARGO_NET_OFFLINE: "true"
        run: |
          bash /opt/agent-src/scripts/build-rpm.sh
          cargo build --release --locked --manifest-path /opt/agent-src/Cargo.toml \
            -p openvibes-rules --example sign_bundle
          # Separate runs: --example would limit a combined build to examples.
          cargo build --release --locked -p openvibes-load
          cargo build --release --locked -p openvibes-ingest --example integration_bundle
          mkdir -p dist tools
          cp $(ls target/rpm/RPMS/x86_64/*.rpm | grep -v openvibes-llm-model) /opt/agent-src/target/rpm/RPMS/x86_64/openvibes-agent-*.rpm \
            /opt/agent-src/target/release/examples/sign_bundle dist/
          cp target/rpm-console/RPMS/x86_64/openvibes-console-*.rpm dist/
          # The offline kit carries the bridge package (no model bytes in it).
          mkdir dist/llm-model
          cp target/rpm/RPMS/x86_64/openvibes-llm-model-*.rpm dist/llm-model/
          cp target/release/openvibes-load target/release/examples/integration_bundle tools/

      - name: Upload RPMs for the end to end jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms
          path: dist/
          if-no-files-found: error

      - name: Upload test tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools
          path: tools/
          if-no-files-found: error

  # The installed platform and agent RPMs against each other: renewal,
  # revocation, expiry re-enrollment, distribution outage, then load smokes.
  integration:
    name: Agent integration (fedora:44)
    needs: fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install test packages
        run: dnf -q -y install git systemd postgresql-server sqlite jq curl procps-ng util-linux

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpms
          path: dist

      - name: Download test tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools
          path: tools

      - name: Install and check RPMs
        run: |
          dnf -q -y install selinux-policy-targeted dist/openvibes-{ingest,distribution,vulns,admin,llm,agent,signer}-*.rpm
          bash scripts/check-rpm.sh
          chmod +x tools/*

      # initdb refuses root: run the integration as a plain user.
      - name: Integration against the installed binaries
        shell: bash
        run: |
          useradd -m ci
          chown -R ci "$GITHUB_WORKSPACE"
          runuser -u ci -- env OPENVIBES_BIN_DIR=/usr/bin \
            AGENT_BIN=/usr/bin/openvibes-agent \
            BUNDLE_BIN="$PWD/tools/integration_bundle" \
            INTEGRATION_DIR=/home/ci/run \
            bash scripts/integration-agent.sh

      # A shared runner is too small and noisy for the full target run; this
      # keeps the generator working. Results live in docs/components/load.md.
      - name: Load smoke test against the installed binaries
        shell: bash
        run: |
          runuser -u ci -- env OPENVIBES_BIN_DIR=/usr/bin LOAD_DIR=/home/ci/load \
            LOAD_BIN="$PWD/tools/openvibes-load" LOAD_ARGS="--findings-every 5" \
            bash scripts/load/run.sh 50 1000 10

      - name: Distribution load smoke against the installed binaries
        shell: bash
        run: |
          runuser -u ci -- env OPENVIBES_BIN_DIR=/usr/bin LOAD_DIR=/home/ci/load-dist MODE=distribution \
            LOAD_BIN="$PWD/tools/openvibes-load" \
            BUNDLE_BIN="$PWD/tools/integration_bundle" \
            bash scripts/load/run.sh 50 1000 10

  # P14 end to end (board #89): the real agent on a real kernel (VM runner:
  # kernel audit is not reachable from a container) sends alarms to the
  # platform built here; they read back through the console API, and a
  # program suppression closes the next one.
  alarms-e2e:
    name: Alarms end to end (real kernel)
    needs: fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpms
          path: dist

      - name: Install auditd, podman and tools
        timeout-minutes: 10
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q auditd rpm2cpio cpio jq podman

      - name: Alarms end to end
        run: bash scripts/alarms-e2e.sh dist

  # The documented install, scripted, under a real systemd (podman fedora:44,
  # systemd as PID 1): PostgreSQL and the platform/agent/console RPMs; the
  # agent enrolls/fetches rules/delivers findings; the console serves TLS and
  # validates the Unix proxy peer UID.
  systemd-e2e:
    # The name is a required status check on main: keep it (the job also
    # covers the console RPM).
    name: End to end under systemd (platform and agent RPMs)
    needs: fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpms
          path: dist

      - name: End to end
        run: |
          chmod +x dist/sign_bundle
          console_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          console_old_rpm=$(find dist -maxdepth 1 -name 'openvibes-console-0.0.9-*.rpm' -type f -print -quit)
          console_rpm=$(find dist -maxdepth 1 -name "openvibes-console-${console_version}-*.rpm" -type f -print -quit)
          bash scripts/systemd-e2e.sh dist dist/sign_bundle \
            "$console_old_rpm" "$console_rpm"

  offline-kit:
    name: Offline kit (installs with no network)
    needs: [changes, fedora]
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.kit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpms
          path: dist
      - name: Build a kit signed with a test key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir kit-rpms
          # The newest console package (dist also holds the older one for the upgrade test).
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          cp dist/openvibes-*-"$version"-*.rpm dist/llm-model/*.rpm kit-rpms/
          rm -f kit-rpms/openvibes-agent-*
          gh release download --repo openvibes-project/openvibes-rules --pattern 'openvibes-rules-*.rpm' --dir kit-rpms
          ls kit-rpms/openvibes-rules-*.rpm > /dev/null || { echo 'no openvibes-rules RPM in the latest rules release' >&2; exit 1; }
          bash scripts/offline-kit-test-kit.sh kit-rpms target/offline 44
      - name: Install from the kit with no network
        run: |
          OPENVIBES_KEY_FINGERPRINT=$(cat target/offline/fingerprint) \
            bash scripts/offline-kit-e2e.sh target/offline/openvibes-platform-*-offline-fedora44.tar

  setup-lifecycle:
    name: Setup life cycle under systemd (install, repair, update, uninstall)
    needs: fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpms
          path: dist
      - name: Life cycle
        run: |
          cp dist/openvibes-agent-*.rpm dist/old/
          bash scripts/setup-lifecycle-e2e.sh dist/old dist
