# Tests the console in real browsers with its in-browser demo data and
# publishes that demo build as a static preview
# with in-browser synthetic data (no server, nothing real) to GitHub Pages.
# Pull requests run the tests only; pushes to main also deploy. Every
# action is pinned to a full commit SHA.
name: Console demo preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crates/openvibes-console/web/**
      - .github/workflows/console-demo-pages.yml
  pull_request:
    branches: [main]
    paths:
      - crates/openvibes-console/web/**
      - .github/workflows/console-demo-pages.yml

permissions:
  contents: read

concurrency:
  group: console-demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Console demo browser tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/openvibes-console/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: crates/openvibes-console/web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint, typecheck and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Install pinned browsers
        run: node_modules/.bin/playwright install --with-deps chromium firefox

      - name: End to end and accessibility (Chromium, Firefox)
        env:
          CI: "true"
        run: npm run test:e2e:demo

      - name: Build with demo data
        env:
          CONSOLE_BASE: /${{ github.event.repository.name }}/
          VITE_DEMO: "true"
        run: |
          npm run build:demo
          # Deep links: Pages serves 404.html for unknown paths.
          cp dist-demo/index.html dist-demo/404.html

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: crates/openvibes-console/web/dist-demo

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
