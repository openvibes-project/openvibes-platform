# A tag vX.Y.Z: build the RPMs, sign and check them, publish the GitHub
# Release, then tell the package repository to rebuild (releases spec §2).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install build packages
        run: >-
          dnf -q -y install git gcc gcc-c++ cmake cargo rust rpm-build rpm-sign gnupg2
          systemd-rpm-macros ImageMagick gh jq
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node.js for console RPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: The tag is the workspace version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - name: Build RPMs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init
          bash scripts/build-rpm.sh
          archive=$(bash scripts/build-console-npm-cache.sh target/console-npm-cache)
          bash scripts/build-console-rpm.sh "$archive" "$(sha256sum "$archive" | cut -d ' ' -f1)"
          mkdir dist
          cp target/rpm/RPMS/x86_64/openvibes-*.rpm target/rpm-console/RPMS/x86_64/openvibes-console-*.rpm dist/
          rm -f dist/*-debuginfo-*.rpm dist/*-debugsource-*.rpm
      - name: Sign and check
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: |
          bash scripts/sign-rpms.sh dist packaging/rpm/openvibes-packages.gpg
          (cd dist && sha256sum *.rpm > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made by hand for this tag (GitHub UI) gets the packages;
          # creating a second one would leave them in an unpublished draft.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "openvibes-platform $GITHUB_REF_NAME" --generate-notes dist/*
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi

  # The offline kit (model-download-and-offline-kit spec §4): the signed
  # packages, the rule sets and Fedora's dependency closure in one tar. It is
  # uploaded only after a network-less container has installed from it.
  offline-kit:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        fedora: [44]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the signed packages and the rule sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir rpms
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'openvibes-*.rpm' --dir rpms
          rm -f rpms/*-debuginfo-* rpms/*-debugsource-* rpms/openvibes-agent-*
          # The rule sets: the latest rules release (signed with the same key).
          gh release download --repo openvibes-project/openvibes-rules --pattern 'openvibes-rules-*.rpm' --dir rpms
      - name: Build the kit
        run: |
          mkdir -p target/offline
          podman run --rm -v "$PWD:/src:ro" -v "$PWD/rpms:/rpms:ro" -v "$PWD/target/offline:/out" \
            "registry.fedoraproject.org/fedora:${{ matrix.fedora }}" \
            bash /src/scripts/build-offline-kit.sh /rpms /out ${{ matrix.fedora }}
      - name: Sign the checksums
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          printf '%s' "$RPM_SIGNING_KEY" | gpg --batch --quiet --import
          printf '%s' "$RPM_SIGNING_PASSPHRASE" > "$RUNNER_TEMP/pass"
          gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/pass" \
            --detach-sign --armor -o target/offline/openvibes-offline/SHA256SUMS.asc \
            target/offline/openvibes-offline/SHA256SUMS
          rm -rf "$RUNNER_TEMP/pass" "$GNUPGHOME"
          bash scripts/build-offline-kit.sh --pack target/offline ${{ matrix.fedora }}
      - name: Test the kit with no network
        run: |
          FEDORA=${{ matrix.fedora }} bash scripts/offline-kit-e2e.sh target/offline/openvibes-platform-*-offline-fedora${{ matrix.fedora }}.tar
      - name: Upload the kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber target/offline/openvibes-platform-*-offline-fedora${{ matrix.fedora }}.tar
