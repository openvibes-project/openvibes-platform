# The OpenVIBES platform in one container (#606), installed and set up from
# this file (#607): copy example.env to .env, fill it in, `docker compose up
# -d`, and `docker compose logs openvibes` says where the console is. Works
# the same with `podman compose`. See docs/components/container.md.
#
# Every start applies the settings: change one, then `docker compose up -d`.
# A value typed straight in here instead of ${...} works too; .env keeps the
# password out of this file.
services:
  openvibes:
    image: ${OPENVIBES_IMAGE:-ghcr.io/openvibes-project/openvibes-platform:latest}
    restart: unless-stopped
    # systemd stops PostgreSQL and the services in order; Docker's default
    # 10 seconds would kill them part way.
    stop_grace_period: 60s
    # A terminal is systemd's console, which is what `docker compose logs`
    # shows: the start messages and where the console is.
    tty: true
    # What systemd needs under Docker (Podman needs none of it, and takes it
    # as is): tmpfs on /run, /run/lock and /tmp, and the host's cgroup tree
    # writable, since Docker mounts it read-only. Not privileged and no extra
    # capabilities, but root in the container can change cgroup limits on
    # the host (ruling on #604). Never add `privileged: true`.
    cgroup: host
    tmpfs: [/run, /run/lock, /tmp]
    environment:
      # The name agents and browsers use for this host (required), and more
      # names or IP addresses, comma-separated.
      OPENVIBES_HOSTNAME: ${OPENVIBES_HOSTNAME:?set OPENVIBES_HOSTNAME in .env}
      OPENVIBES_EXTRA_NAMES: ${OPENVIBES_EXTRA_NAMES:-}
      # The console's first administrator, "admin" (at least 15 characters).
      OPENVIBES_ADMIN_PASSWORD: ${OPENVIBES_ADMIN_PASSWORD:?set OPENVIBES_ADMIN_PASSWORD in .env}
      OPENVIBES_CONSOLE_PORT: ${OPENVIBES_CONSOLE_PORT:-443}
      OPENVIBES_INGEST_PORT: ${OPENVIBES_INGEST_PORT:-18423}
      OPENVIBES_DISTRIBUTION_PORT: ${OPENVIBES_DISTRIBUTION_PORT:-18424}
      # A CA from your PKI instead of one OpenVIBES makes: its certificate
      # chain and key in one PEM file, mounted below.
      OPENVIBES_CA_FILE: ${OPENVIBES_CA_FILE:-}
    # Each port is the same on both sides: the console only answers to the
    # address it was set up for. The settings above pick them.
    ports:
      - "${OPENVIBES_CONSOLE_PORT:-443}:${OPENVIBES_CONSOLE_PORT:-443}"                  # console
      - "${OPENVIBES_INGEST_PORT:-18423}:${OPENVIBES_INGEST_PORT:-18423}"                # agents
      - "${OPENVIBES_DISTRIBUTION_PORT:-18424}:${OPENVIBES_DISTRIBUTION_PORT:-18424}"    # rule distribution
      - "514:514/udp"     # network devices (syslog)
    volumes:
      # With OPENVIBES_CA_FILE=/mnt/ca.pem:
      # - ./ca.pem:/mnt/ca.pem:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - etc:/etc/openvibes
      - pgsql:/var/lib/pgsql
      - admin:/var/lib/openvibes-admin
      - console:/var/lib/openvibes-console
      - feed:/var/lib/openvibes-feed
      - ingest:/var/lib/openvibes-ingest
      - signer:/var/lib/openvibes-signer
      - vulns:/var/lib/openvibes-vulns
      # The key the assistant container shares (#652); made on the first start.
      - assistant-key:/var/lib/openvibes-assistant-key
      - backups:/var/backups/openvibes       # the database before each new image (#609)

  # The assistant (early beta, #643): off unless COMPOSE_PROFILES=assistant
  # in .env. It downloads its model (about 2.7 GB) on its first start, and
  # the console shows the assistant once it answers. It shares the platform
  # container's network, so only the platform reaches it (127.0.0.1:18430).
  assistant:
    profiles: [assistant]
    image: ${OPENVIBES_ASSISTANT_IMAGE:-ghcr.io/openvibes-project/openvibes-assistant:latest}
    restart: unless-stopped
    network_mode: service:openvibes
    depends_on: [openvibes]
    volumes:
      - assistant-models:/var/lib/openvibes-llm/models
      - assistant-key:/var/lib/openvibes-assistant-key:ro

volumes:
  etc:
  pgsql:
  admin:
  console:
  feed:
  ingest:
  signer:
  vulns:
  assistant-key:
  backups:
  assistant-models:
