# openvibes-llm on a GPU through Vulkan (NVIDIA, AMD, Intel): the Vulkan
# build of the same pinned llama-server, and access to the GPU devices.
# Set OPENVIBES_LLM_GPU_LAYERS=999 in /etc/openvibes/llm.conf.
[Service]
ExecStart=
ExecStart=/usr/libexec/openvibes-llm/llama-server-vulkan \
    --model ${OPENVIBES_LLM_MODEL} --alias ${OPENVIBES_LLM_ALIAS} \
    --host 127.0.0.1 --port ${OPENVIBES_LLM_PORT} \
    --ctx-size ${OPENVIBES_LLM_CONTEXT} --threads ${OPENVIBES_LLM_THREADS} \
    --n-gpu-layers ${OPENVIBES_LLM_GPU_LAYERS} --parallel ${OPENVIBES_LLM_PARALLEL} \
    --api-key-file %d/api-key \
    --no-webui --no-slots --offline --jinja --timeout 300 --log-colors off
# The GPU devices only; everything else in /dev stays closed.
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=char-drm rw
DeviceAllow=/dev/nvidiactl rw
DeviceAllow=/dev/nvidia0 rw
DeviceAllow=/dev/nvidia-uvm rw
SupplementaryGroups=render video
# GPU drivers compile shaders at run time.
MemoryDenyWriteExecute=no
