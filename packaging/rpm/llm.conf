# openvibes-llm settings (read by openvibes-llm.service and checked by
# openvibes-llm-check before every start). Restart after a change:
#   systemctl restart openvibes-llm
#
# The model is chosen in /var/lib/openvibes-llm/model.conf (it overrides
# this file), written when a model is installed with its publisher's SHA-256:
#   runuser -u openvibes_admin -- openvibes-admin assistant model install \
#       FILE.gguf --sha256 HEX --alias NAME
# The name the server reports; the console's [assistant.backend] model.
OPENVIBES_LLM_ALIAS=local-model
# Loopback port; the console's url is http://127.0.0.1:PORT/v1.
OPENVIBES_LLM_PORT=18430
# Context size in tokens: 8192 fits the small and medium profiles.
OPENVIBES_LLM_CONTEXT=8192
# CPU threads: the number of physical cores to give the model.
OPENVIBES_LLM_THREADS=4
# Layers on the GPU: 0 for the CPU build; 999 (all) with openvibes-llm-vulkan.
OPENVIBES_LLM_GPU_LAYERS=0
# Questions answered at once (the console's backend concurrency).
OPENVIBES_LLM_PARALLEL=1
