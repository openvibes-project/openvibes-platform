# openvibes-llm settings (read by openvibes-llm.service and
# openvibes-llm-proxy.service, checked by openvibes-llm-check before every
# start). After a change, restart the socket (a running server restarts
# with it; an idle one picks the change up on the next question):
#   systemctl restart openvibes-llm.socket
#
# The model is chosen in /var/lib/openvibes-llm/model.conf (it overrides
# this file), written when a model is installed with its publisher's SHA-256:
#   runuser -u openvibes-admin -- openvibes-admin assistant model install \
#       FILE.gguf --sha256 HEX --alias NAME
# The name the server reports; the console's [assistant.backend] model.
OPENVIBES_LLM_ALIAS=local-model
# Loopback port of openvibes-llm.socket; the console's url is
# http://127.0.0.1:PORT/v1. The socket listens on 18430: to use another port,
# also `systemctl edit openvibes-llm.socket` (see the comment in that unit;
# with SELinux enforcing the new port needs a label as well).
OPENVIBES_LLM_PORT=18430
# Time without a question before the model is unloaded (its memory freed):
# a whole number with s, min or h, from 30s to 24h; infinity keeps it loaded.
# The first question after that waits while the model loads again.
OPENVIBES_LLM_IDLE=5min
# Context size in tokens: 8192 fits the small and medium profiles.
OPENVIBES_LLM_CONTEXT=8192
# CPU threads: the number of physical cores to give the model.
OPENVIBES_LLM_THREADS=4
# Layers on the GPU: 0 for the CPU build; 999 (all) with openvibes-llm-vulkan.
OPENVIBES_LLM_GPU_LAYERS=0
# Questions answered at once (the console's backend concurrency).
OPENVIBES_LLM_PARALLEL=1
