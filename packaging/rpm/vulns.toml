# openvibes-vulns: Fedora security advisories fetched and matched against
# host inventories; see docs/components/openvibes-vulns.md.
database_url = "postgresql:///openvibes?host=/run/postgresql&user=openvibes_vulns"
health_listen = "127.0.0.1:18483"          # /health, /ready; loopback only
check_interval_minutes = 60                # 15 to 1440; downloads only on change
# Offline platforms: set a local mirror, or import with openvibes-admin feeds import.
metalink_url = "https://mirrors.fedoraproject.org/metalink?repo=updates-released-f{release}&arch={arch}"
# proxy_url = "http://proxy.example:3128"
# Enrichment (exploited in the wild, likelihood of exploitation); "" turns
# a source off, e.g. offline: openvibes-admin feeds import FILE --source kev.
kev_url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
epss_url = "https://epss.empiricalsecurity.com/epss_scores-current.csv.gz"
