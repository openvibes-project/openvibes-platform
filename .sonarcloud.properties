# SonarQube Cloud automatic analysis. The OpenAPI client is generated
# (scripts/generate-console-client.sh); duplication there is not ours.
# Tests also repeat their fixtures and checks on purpose (a service test reads
# like its port test); the repetition there is not the kind worth removing.
sonar.cpd.exclusions=crates/openvibes-console/web/src/api/generated.ts,\
  **/tests/**,**/*.test.ts,**/*.test.tsx,crates/openvibes-console/web/e2e/**
# The TUI mockup generators render example screens (sample IPs, http URLs in
# screen text); they are design documents, not code that runs.
sonar.exclusions=docs/specs/**
