# SonarQube Cloud automatic analysis. The OpenAPI client is generated
# (scripts/generate-console-client.sh); duplication there is not ours.
sonar.cpd.exclusions=crates/openvibes-console/web/src/api/generated.ts

# Reviewed false positives (board #31/#53), kept here so they are versioned
# and reviewable rather than marked by hand in the SonarCloud UI.
sonar.issue.ignore.multicriteria=osvBackfill,tinyGguf
# migrations/0013_osv.sql: the UPDATE without WHERE is a deliberate one-time
# backfill of every existing row; applied migrations are immutable.
sonar.issue.ignore.multicriteria.osvBackfill.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.osvBackfill.resourceKey=migrations/0013_osv.sql
# scripts/tiny-gguf.py: a test helper that writes a tiny model file to the
# path its own caller passes; it is not shipped and takes no outside input.
sonar.issue.ignore.multicriteria.tinyGguf.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.tinyGguf.resourceKey=scripts/tiny-gguf.py
